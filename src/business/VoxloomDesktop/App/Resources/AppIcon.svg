<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Voxloom</title>
  <desc id="description">Seven sound levels from the spoken word Vox, drawn as a deep green waveform on black.</desc>
  <!-- Levels use seven equal windows of macOS Samantha speaking Vox at 155 words per minute.
       RMS values are normalized and compressed for readability at small sizes. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#080909"/>
      <stop offset="1" stop-color="#080909"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="182" fill="url(#background)"/>
  <rect x="102" y="102" width="820" height="820" rx="180" fill="none" stroke="#D9E5DB" stroke-opacity=".15" stroke-width="4"/>
  <g fill="#198951">
    <rect x="273" y="462.5" width="46" height="99" rx="23"/>
    <rect x="347" y="347" width="46" height="330" rx="23"/>
    <rect x="421" y="354.5" width="46" height="315" rx="23"/>
    <rect x="495" y="382.5" width="46" height="259" rx="23"/>
    <rect x="569" y="432.5" width="46" height="159" rx="23"/>
    <rect x="643" y="481" width="46" height="62" rx="23"/>
    <rect x="717" y="473" width="46" height="78" rx="23"/>
  </g>
</svg>

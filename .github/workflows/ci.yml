name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          sw_vers
          swift --version
          python3 --version

      - name: Prepare RxSwift
        run: bash scripts/prepare-rx.sh

      - name: Check Python worker protocol and coverage
        run: python3 scripts/check-python.py

      - name: Build Swift products
        run: bash scripts/swift-command.sh build

      - name: Run Swift module and desktop tests
        run: bash scripts/test-swift.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version

      - name: Prepare RxSwift
        run: bash scripts/prepare-rx.sh

      - name: Check Python worker protocol and coverage
        run: python3 scripts/check-python.py

      - name: Test packaging and version selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build Swift products
        run: |
          mkdir -p .build/reports
          log=.build/reports/swift-build.log
          bash scripts/swift-command.sh build 2>&1 | tee "$log" || {
            result=$?
            details="$(grep -im 8 'error:' "$log" || true)"
            details="${details:-$(tail -n 8 "$log")}"
            details="${details//%/%25}"
            details="${details//$'\r'/%0D}"
            details="${details//$'\n'/%0A}"
            printf '::error title=Swift build::%s\n' "${details:-The build produced no diagnostics.}"
            exit "$result"
          }

      - name: Run Swift module and desktop tests
        run: bash scripts/test-swift.sh
